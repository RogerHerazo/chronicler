[project]
name = "chronicler-dnd"
version = "0.1.0"
description = "Live, local D&D session scribe: records your table, transcribes it locally and keeps a running recap, NPC list and open threads while you play."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Roger Herazo" }]
requires-python = ">=3.11"
keywords = ["dnd", "ttrpg", "transcription", "whisper", "session-notes", "claude", "ollama"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Web Environment",
  "Intended Audience :: End Users/Desktop",
  "Operating System :: Microsoft :: Windows",
  "Operating System :: MacOS",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Games/Entertainment :: Role-Playing",
  "Topic :: Multimedia :: Sound/Audio :: Speech",
]
dependencies = [
  "anthropic>=0.70",
  "faster-whisper>=1.1",
  "fastapi>=0.115",
  "httpx>=0.27",
  "jinja2>=3.1",
  "keyring>=25",
  "markdown-it-py>=3",
  "numpy>=1.26",
  "platformdirs>=4",
  "pydantic>=2.7",
  "python-multipart>=0.0.9",
  "rich>=13",
  "soundcard>=0.4.3",
  "soundfile>=0.12",
  "soxr>=0.4",
  "sse-starlette>=2.1",
  "tomli-w>=1.0",
  "typer>=0.12",
  "uvicorn>=0.30",
]

[project.urls]
Homepage = "https://github.com/RogerHerazo/chronicler"
Issues = "https://github.com/RogerHerazo/chronicler/issues"

[project.scripts]
chronicler = "chronicler.cli:app"

[dependency-groups]
dev = [
  "pre-commit>=3.7",
  "pyright>=1.1.380",
  "pytest>=8",
  "pytest-asyncio>=0.24",
  "ruff>=0.6",
]

[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/chronicler"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "PTH", "ASYNC"]
ignore = ["RUF001", "RUF002", "RUF003"]

[tool.ruff.lint.per-file-ignores]
"src/chronicler/cli.py" = ["B008"]

[tool.pyright]
include = ["src", "tests"]
pythonVersion = "3.11"
typeCheckingMode = "standard"
reportMissingTypeStubs = false

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = [
  "slow: downloads a Whisper model or does real transcription",
]
