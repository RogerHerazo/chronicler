name: Bug report
description: Something does not work
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What did you do, what did you expect, and what happened instead?
    validations:
      required: true
  - type: textarea
    id: doctor
    attributes:
      label: Health check output
      description: Paste the output of `chronicler doctor`.
      render: text
    validations:
      required: true
  - type: input
    id: os
    attributes:
      label: Operating system
      placeholder: Windows 11, Ubuntu 24.04, macOS 15…
    validations:
      required: true
  - type: dropdown
    id: provider
    attributes:
      label: Analysis provider
      options: [Claude, Ollama]
  - type: textarea
    id: logs
    attributes:
      label: Terminal output
      description: Anything printed in the terminal where Chronicler runs. Remove anything private.
      render: text
